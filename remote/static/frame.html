<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Photo frame</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
  img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
        opacity: 0; -webkit-transition: opacity 2s; transition: opacity 2s; }
  img.show { opacity: 1; }
  body.paper { background: #efece4; }
  body.paper img { -webkit-filter: grayscale(1) contrast(1.1); filter: grayscale(1) contrast(1.1); }
  #corner { position: fixed; right: 16px; bottom: 14px; color: #fff; font-size: 28px; font-weight: 200;
            text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  #empty { position: absolute; top: 0; left: 0; right: 0; color: #9aa5ae; padding: 40px 24px; font-size: 18px; line-height: 1.5; }
  #modes { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; display: none; z-index: 5; }
  #modes a { color: #e8ecef; background: rgba(34,42,51,.9); padding: 12px 18px; border-radius: 12px;
             margin: 0 6px; text-decoration: none; font-size: 16px; }
</style>
</head>
<body>
<img id="a"><img id="b">
<div id="corner"></div>
<div id="empty" style="display:none">No photos yet.<br>Put pictures in the phone folder <b>Pictures/Frame</b>, then reopen this.<br><br><small>Tap the screen to switch to the clock.</small></div>
<div id="modes"><a href="#" onclick="return go('clock')">Clock</a><a href="#" onclick="return go('frame')">Photo frame</a></div>
<script src="/stand.js"></script>
<script>
var list = [], i = 0, front = 'a', seconds = 60;
function pad(n) { return (n < 10 ? '0' : '') + n; }
function clock() { var d = new Date(); document.getElementById('corner').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function next() {
  if (!list.length) return;
  var back = front === 'a' ? 'b' : 'a';
  var img = document.getElementById(back);
  img.onload = function () {
    img.className = 'show';
    document.getElementById(front).className = '';
    front = back;
  };
  img.src = '/photo/' + encodeURIComponent(list[i % list.length]);
  i++;
}
function load() {
  var x = new XMLHttpRequest();
  x.open('GET', '/api/photos', true);
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || x.status !== 200) return;
    var d = JSON.parse(x.responseText);
    seconds = d.interval || 60;
    if (!d.photos.length) {
      document.getElementById('empty').style.display = 'block';
      return;
    }
    list = d.photos;
    for (var k = list.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = list[k]; list[k] = list[j]; list[j] = t; }
    next();
    setInterval(next, seconds * 1000);
  };
  x.send();
}
try { if (localStorage.getItem('paper') === '1') document.body.className = 'paper'; } catch (e) {}
clock(); setInterval(clock, 10000);
load();
</script>
</body>
</html>
