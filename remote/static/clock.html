<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Clock</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #12161b; background-image: linear-gradient(rgba(10,14,18,.4), rgba(10,14,18,.55)), url(/wallpaper.jpg);
         background-size: cover; background-position: center;
         color: #e8ecef; font-family: sans-serif; overflow: hidden; }
  .wrap { text-shadow: 0 1px 8px rgba(0,0,0,.65); }
  .wrap { position: absolute; top: 50%; left: 0; right: 0; text-align: center;
          -webkit-transform: translateY(-55%); transform: translateY(-55%); }
  #time { font-size: 30vw; font-weight: 100; letter-spacing: -2px; line-height: 1; }
  #date { font-size: 5vw; color: #d5e0e6; margin-top: 2vw; letter-spacing: 2px; }
  #wx { font-size: 4.6vw; color: #c7d3da; margin-top: 9vw; }
  #wx b { font-size: 9vw; font-weight: 200; display: block; color: #e8ecef; }
  body.land #time { font-size: 22vw; }
  /* Landscape (phone sideways on the stand): size by height so the time isn't cut off. */
  @media (orientation: landscape) {
    body #time, body.land #time { font-size: 34vh; }
    #date { font-size: 6.5vh; margin-top: 1vh; }
    #wx { font-size: 6vh; margin-top: 5vh; }
    #wx b { font-size: 12vh; }
    .wrap { -webkit-transform: translateY(-50%); transform: translateY(-50%); }
  }
  /* "Paper" look: e-ink style, like a Kindle */
  body.paper { background: #efece4; color: #161616; font-family: Georgia, 'Noto Serif', serif; }
  body.paper #time { font-weight: 400; letter-spacing: 0; }
  body.paper #date, body.paper #wx { color: #444; }
  body.paper #wx b { color: #161616; font-weight: 400; }
  body.paper #modes a { background: #dedad0; color: #161616; }
  #modes { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; display: none; }
  #modes a { color: #e8ecef; background: #222a33; padding: 12px 18px; border-radius: 12px;
             margin: 0 6px; text-decoration: none; font-size: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="time">--:--</div>
  <div id="date"></div>
  <div id="wx"></div>
</div>
<div id="modes"><a href="#" onclick="return go('clock')">Clock</a><a href="#" onclick="return go('frame')">Photo frame</a><a href="#" onclick="return paper()">Paper look</a></div>
<script src="/stand.js"></script>
<script>
var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad(n) { return (n < 10 ? '0' : '') + n; }
function tick() {
  var d = new Date();
  document.getElementById('time').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  document.getElementById('date').textContent =
    DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  document.body.className = (window.innerWidth > window.innerHeight ? 'land' : '') +
    (isPaper() ? ' paper' : '');
}
function isPaper() { try { return localStorage.getItem('paper') === '1'; } catch (e) { return false; } }
function paper() {
  try { localStorage.setItem('paper', isPaper() ? '0' : '1'); } catch (e) {}
  tick();
  return false;
}
var pos = null;
function locate() {
  // GPS only (no Google location services): use the last fix up to 1 h old, else try a fresh one.
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(function (p) {
    var first = !pos;
    pos = p.coords;
    if (first) weather();
  }, function () {}, { enableHighAccuracy: false, maximumAge: 3600000, timeout: 60000 });
}
function weather() {
  var x = new XMLHttpRequest();
  var q = pos ? '?lat=' + pos.latitude.toFixed(3) + '&lon=' + pos.longitude.toFixed(3) : '';
  x.open('GET', '/api/weather' + q, true);
  x.onreadystatechange = function () {
    if (x.readyState !== 4 || x.status !== 200) return;
    var w = JSON.parse(x.responseText);
    document.getElementById('wx').innerHTML = '<b>' + w.temp + '°</b>' + w.text + ' · ' +
      w.city + '<br>H ' + w.max + '°  L ' + w.min + '°  ·  ' + w.humidity + '% humidity';
  };
  x.send();
}
tick(); setInterval(tick, 1000);
window.addEventListener('resize', tick);
weather(); setInterval(weather, 15 * 60 * 1000);
locate(); setInterval(locate, 30 * 60 * 1000);
</script>
</body>
</html>
